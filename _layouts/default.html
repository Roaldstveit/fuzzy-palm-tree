

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div class="container">
  
  <nav class="sidebar">
    <h2>Innhald</h2>
    <ul>
      {% for item in site.sidebar %}
        <li>

      {% endfor %}
    </ul>
  </nav>

  <main class="content">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>

</div>

</body>
</html>
